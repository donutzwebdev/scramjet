<!DOCTYPE html>
<html>
<head>
<title>Draft 9 Proxy</title>
<script src="./scramjet.bundle.js"></script>
</head>
<body>
<script>
window.addEventListener('load', function() {
  try {
    const { ScramjetController } = $scramjetLoadController();

    const scramjet = new ScramjetController({
      prefix: "/scramjet/",
      codec: {
        encode: (url) => encodeURIComponent(url),
        decode: (url) => decodeURIComponent(url)
      },
      files: {
        wasm: "/scramjet/scramjet.wasm.wasm",
        all:  "/scramjet/scramjet.all.js",
        sync: "/scramjet/scramjet.sync.js"
      },
      flags: {
        captureErrors: true,
        strictRewrites: true,
        allowInvalidJs: true,
        allowFailedIntercepts: true
      }
    });

    navigator.serviceWorker.register("/scramjet/scramjet.sw.js", { scope: "/" })
      .then(() => navigator.serviceWorker.ready)
      .then(() => scramjet.init())
      .then(() => {
        console.log("✅ Scramjet proxy ready!");
        window.__scramjet = scramjet;
      })
      .catch(e => console.error("Scramjet init failed:", e));

  } catch(e) {
    console.error("Scramjet load error:", e);
  }
});
</script>
</body>
</html>
